name: Peachy macOS 诊断
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-candidate-x86_64
          run-id: 43974234338
          github-token: ${{ github.token }}
      - name: 验证镜像中的签名资源
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/Peach-inspect"
          mkdir -p "$mount"
          hdiutil attach release/*-macos-x86_64.dmg -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          staging="$RUNNER_TEMP/Peach-stage"
          mkdir -p "$staging"
          ditto "$mount/Peach.app" "$staging/Peach.app"
          xattr -cr "$staging/Peach.app"
          codesign --force --sign - "$staging/Peach.app"
          codesign --verify --deep --strict --verbose=4 "$staging/Peach.app"
          hdiutil detach "$mount"
          trap - EXIT
          ln -s /Applications "$staging/Applications"
          hdiutil create -srcfolder "$staging" -fs APFS -format UDZO "$RUNNER_TEMP/Peach-APFS.dmg"
          hdiutil attach "$RUNNER_TEMP/Peach-APFS.dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict --verbose=4 "$mount/Peach.app"
          python3 scripts/smoke_macos.py "$mount/Peach.app"
