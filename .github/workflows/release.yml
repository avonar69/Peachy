name: Peachy macOS 诊断
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-candidate-x86_64
          run-id: 43974234338
          github-token: ${{ github.token }}
      - name: 验证镜像中的签名资源
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/Peach-inspect"
          mkdir -p "$mount"
          hdiutil attach release/*-macos-x86_64.dmg -shadow "$RUNNER_TEMP/Peach-shadow" -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          xattr -cr "$mount/Peach.app"
          codesign --force --sign - "$mount/Peach.app"
          codesign --verify --deep --strict --verbose=4 "$mount/Peach.app"
          python3 scripts/smoke_macos.py "$mount/Peach.app"
